<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shrimpy spike thread</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #1b1f24; --dim: #667085; --card: #f3f5f8; --user: #e4effa; --ok: #1a7f37; --warn: #9a6700; --err: #cf222e; --line: #d0d7de; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14171c; --fg: #e6e9ee; --dim: #8b93a1; --card: #1d222a; --user: #22344a; --ok: #7bd88f; --warn: #f2c261; --err: #f07178; --line: #2d333b; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, sans-serif; display: flex; flex-direction: column; height: 100dvh; }
  header { padding: 8px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  header b { font-size: 14px; }
  #conn { font: 12px ui-monospace, monospace; padding: 1px 8px; border-radius: 10px; background: var(--card); }
  body[data-connection="connected"] #conn { color: var(--ok); }
  body[data-connection="disconnected"] #conn, body[data-connection="failed"] #conn { color: var(--err); }
  body[data-connection="connecting"] #conn { color: var(--warn); }
  #status, #queued { color: var(--dim); font-size: 13px; }
  main { flex: 1; overflow-y: auto; padding: 8px 16px; display: flex; flex-direction: column; gap: 10px; }
  .user { background: var(--user); padding: 8px 12px; border-radius: 8px; align-self: flex-end; max-width: 80%; white-space: pre-wrap; }
  .assistant { max-width: 90%; }
  .assistant pre, .tool pre { margin: 0; white-space: pre-wrap; font: 13px/1.4 ui-monospace, monospace; }
  .thinking { color: var(--dim); font-style: italic; font-size: 13px; margin-bottom: 4px; }
  .tool { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; max-width: 90%; }
  .tool header { padding: 0 0 4px; border: 0; font: 13px ui-monospace, monospace; }
  .tool .running { color: var(--warn); } .tool .done { color: var(--ok); } .tool .error, .tool .interrupted { color: var(--err); }
  .marker { color: var(--dim); font-size: 12px; text-align: center; }
  form { display: flex; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); }
  input { flex: 1; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  button { font: inherit; padding: 8px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--fg); cursor: pointer; }
  #error { color: var(--err); font-size: 13px; padding: 0 16px 6px; }
</style>
</head>
<body data-connection="connecting">
<header><b>Shrimpy spike thread</b><span id="conn">connecting</span><span id="status"></span><span id="queued"></span></header>
<main id="chat"></main>
<div id="error"></div>
<form id="form"><input id="text" autocomplete="off" placeholder="Message the agent" autofocus><button id="send">Send</button><button id="stop" type="button">Stop</button></form>
<script type="module" src="/page.js"></script>
</body>
</html>
